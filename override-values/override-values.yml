useHostName: true
useIngress: true
useAutoScaling: false
useWorkloadIdentity: true
useSecretsVault: false
useSnowflakeCredentials: false

resource:
  limits:
    memory: '256Mi'
    cpu: '250m'

livenessProbe:
  port: 8080
  healthPath: '/health'
  initialDelaySeconds: 30
  periodSeconds: 60
  failureThreshold: 3

## Ingress ########################################################################################
ingress:
  paths:
    - path: /de/securities/rules
      pathType: Prefix
      serviceName: security-rules
      servicePort: 80
  # nginx-ingress proxy timeouts. /executeRules blocks until the
  # archive-then-insert pipeline finishes — a Security Master GROUP run
  # against Snowflake can take several minutes. Default proxy_read_timeout
  # is 60s and was tripping a 504 mid-run. 600s (10 min) leaves ample
  # headroom.
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
###################################################################################################

