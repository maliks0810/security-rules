basePath: /de/securities/rules
definitions:
  securityrules_security-rules_internal_app_models.Asset:
    properties:
      all_complete:
        type: boolean
      asset_id:
        type: string
      assign_to:
        type: string
      bbg_last_refresh:
        type: string
      exception_count:
        type: integer
      exception_date:
        type: string
      figi:
        type: string
      priority:
        type: string
      security_description:
        type: string
      severity:
        type: string
      trader:
        type: string
      trading_team:
        type: string
      type:
        type: string
    type: object
  securityrules_security-rules_internal_app_models.Exception:
    properties:
      asset_id:
        type: string
      assign_to:
        type: string
      assign_to_id:
        type: integer
      comment_id:
        type: integer
      created_by:
        type: string
      created_date:
        type: string
      exception_date:
        type: string
      exception_id:
        type: integer
      exception_status:
        type: string
      exception_time:
        type: string
      exception_type:
        type: string
      id_bb_global:
        type: string
      issue_description:
        type: string
      modified_by:
        type: string
      modified_date:
        type: string
      priority:
        type: string
      result_data:
        type: string
      result_type_id:
        type: integer
      rule_id:
        type: integer
      rule_name:
        type: string
      severity:
        type: string
      status_id:
        type: integer
      suppress_date:
        type: string
    type: object
  securityrules_security-rules_internal_app_models.Rule:
    properties:
      environment:
        type: string
      rule_command:
        type: string
      rule_id:
        type: integer
      rule_name:
        type: string
    type: object
info:
  contact: {}
  description: REST API for managing security rules, assets, and SECURITY_EXCEPTION
    rows.
  title: Security Rules API
  version: "1.0"
paths:
  /v1/api/events:
    get:
      description: Long-lived text/event-stream that pushes events such as security_exception.inserted
        to subscribed clients.
      produces:
      - text/event-stream
      responses:
        "200":
          description: stream of SSE-formatted events
          schema:
            type: string
      summary: Server-Sent Events stream of domain changes
      tags:
      - events
  /v1/api/executeRules:
    get:
      description: Runs every rule for the given process_type against the asset and
        inserts any returned rows as security exceptions.
      parameters:
      - description: Process type
        in: query
        name: process_type
        required: true
        type: string
      - description: Asset ID
        in: query
        name: asset_id
        required: true
        type: string
      - description: Bloomberg global ID
        in: query
        name: id_bb_global
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rules executed
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: process_type and asset_id are required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to execute rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute rules for an asset
      tags:
      - rules
  /v1/api/getAssets:
    get:
      description: Returns the deduplicated set of assets, optionally filtered by
        exception type CODE and severity (CATEGORY_TYPE.CODE).
      parameters:
      - description: EXCEPTION_TYPE.CODE filter
        in: query
        name: exception_type
        type: string
      - description: CATEGORY_TYPE.CODE filter
        in: query
        name: severity
        type: string
      - description: SEVERITY_TYPE.CODE filter
        in: query
        name: priority
        type: string
      - description: RULE_CATALOG.NAME filter
        in: query
        name: rule_catalog
        type: string
      - description: RULE.RULE_NAME filter
        in: query
        name: rule_name
        type: string
      - description: EXCEPTION_STATUS.CODE filter
        in: query
        name: exception_status
        type: string
      - description: DM_USER.USER filter
        in: query
        name: assign_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.Asset'
            type: array
        "500":
          description: failed to query assets
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List assets with exception summary
      tags:
      - assets
  /v1/api/getDMUsers:
    get:
      description: Returns DM_USER.USER values ordered by ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query users
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List DM users
      tags:
      - users
  /v1/api/getExceptionStatus:
    get:
      description: Returns EXCEPTION_STATUS.CODE values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception status
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception status codes
      tags:
      - exception-status
  /v1/api/getExceptionTypes:
    get:
      description: Returns EXCEPTION_TYPE.NAME values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception type names
      tags:
      - exception-types
  /v1/api/getExceptions:
    get:
      description: Returns rows from GET_EXCEPTIONS, which reads the slim EXCEPTION
        table joined with RULE_2 and the EXCEPTION_*_TYPE lookups.
      parameters:
      - description: Asset ID filter
        in: query
        name: asset_id
        type: string
      - description: EXCEPTION_TYPE.NAME filter
        in: query
        name: exception_type
        type: string
      - description: EXCEPTION_SEVERITY_TYPE.NAME filter
        in: query
        name: severity
        type: string
      - description: EXCEPTION_PRIORITY_TYPE.NAME filter
        in: query
        name: priority
        type: string
      - description: RULE_CATALOG.NAME filter (reserved — RULE_2 does not carry RULE_CATALOG_ID
          for filtering yet)
        in: query
        name: rule_catalog
        type: string
      - description: RULE_2.RULE_NAME filter
        in: query
        name: rule_name
        type: string
      - description: Reserved (RULE_2 has no rule_group yet)
        in: query
        name: rule_group
        type: string
      - description: EXCEPTION_STATUS.NAME filter
        in: query
        name: exception_status
        type: string
      - description: DM_USER.USER filter
        in: query
        name: assign_to
        type: string
      - description: SQL ILIKE pattern against RULE_2.RULE_NAME
        in: query
        name: rule_name_pattern
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.Exception'
            type: array
        "500":
          description: failed to query exceptions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exceptions
      tags:
      - exceptions
  /v1/api/getPriorityTypes:
    get:
      description: Returns EXCEPTION_PRIORITY_TYPE.NAME values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query priority types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List priority names
      tags:
      - priority-types
  /v1/api/getRuleCatalogs:
    get:
      description: Returns RULE_CATALOG.NAME values joined to RULE_GROUP by RULE_GROUP_ID
        and filtered by rule group name.
      parameters:
      - description: Rule group name
        in: query
        name: rule_group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: rule_group query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to query rule types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule type names for a rule group
      tags:
      - rule-catalogs
  /v1/api/getRuleGroups:
    get:
      description: Returns RULE_GROUP.NAME values ordered by RULE_GROUP_ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query rule groups
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule group names
      tags:
      - rule-groups
  /v1/api/getRules:
    get:
      description: Returns rules from GET_RULES, optionally filtered by rule type
        (RULE_CATALOG.NAME).
      parameters:
      - description: Process type filter
        in: query
        name: process_type
        type: string
      - description: RULE_CATALOG.NAME filter
        in: query
        name: rule_catalog
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.Rule'
            type: array
        "500":
          description: failed to query rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rules
      tags:
      - rules
  /v1/api/getSeverityTypes:
    get:
      description: Returns CATEGORY_TYPE.CODE values ordered by CATEGORY_RANK.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query severity types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List severity codes
      tags:
      - severity-types
  /v1/api/info:
    get:
      description: Returns a static welcome string used as a basic liveness check.
      produces:
      - text/plain
      responses:
        "200":
          description: Welcome to Go microservices using Fiber
          schema:
            type: string
      summary: Service welcome message
      tags:
      - info
  /v1/api/updateAssignTo:
    get:
      description: Resolves assign_to against DM_USER and updates every
      parameters:
      - description: Asset ID
        in: query
        name: asset_id
        required: true
        type: string
      - description: DM_USER.USER name (empty to unassign)
        in: query
        name: assign_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rows updated
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: asset_id query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to update assign to
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update EXCEPTION.ASSIGN_TO_ID for an asset
      tags:
      - exceptions
swagger: "2.0"
