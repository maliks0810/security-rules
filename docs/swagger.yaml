basePath: /de/securities/rules
definitions:
  securityrules_security-rules_internal_app_models.Asset:
    properties:
      asset_id:
        type: string
      assign_to:
        type: string
      bbg_last_refresh:
        type: string
      exception_count:
        type: integer
      exception_date:
        type: string
      figi:
        type: string
      priority:
        type: string
      security_description:
        type: string
      severity:
        type: string
      trader:
        type: string
      trading_team:
        type: string
      type:
        type: string
    type: object
  securityrules_security-rules_internal_app_models.Rule:
    properties:
      environment:
        type: string
      rule_command:
        type: string
      rule_id:
        type: integer
      rule_name:
        type: string
    type: object
  securityrules_security-rules_internal_app_models.SecurityException:
    properties:
      asset_id:
        type: string
      assign_to:
        type: string
      assign_to_date:
        type: string
      assigned_by:
        type: string
      category_type_id:
        type: integer
      created_by:
        type: string
      created_date:
        type: string
      exception_source_id:
        type: integer
      exception_status_id:
        type: integer
      issue_description:
        type: string
      modified_by:
        type: string
      modified_date:
        type: string
      priority:
        type: string
      process_type_id:
        type: integer
      resolve_date:
        type: string
      result_type_id:
        type: integer
      rule_id:
        type: integer
      rule_name:
        type: string
      run_date:
        type: string
      run_start:
        type: string
      security_exception_id:
        type: integer
      severity_type_id:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for managing security rules, assets, and SECURITY_EXCEPTION
    rows.
  title: Security Rules API
  version: "1.0"
paths:
  /v1/api/events:
    get:
      consumes:
      - application/json
      description: |-
        Inserts one or more SECURITY_EXCEPTION rows. Accepts an array of SecurityException objects.
        Long-lived text/event-stream that pushes events such as security_exception.inserted to subscribed clients.
      parameters:
      - description: Security exceptions to insert
        in: body
        name: exceptions
        required: true
        schema:
          items:
            $ref: '#/definitions/securityrules_security-rules_internal_app_models.SecurityException'
          type: array
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: stream of SSE-formatted events
          schema:
            type: string
        "201":
          description: Created
        "400":
          description: invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to insert security exceptions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Server-Sent Events stream of domain changes
      tags:
      - security-exceptions
      - events
  /v1/api/executeRules:
    post:
      description: Runs every rule for the given process_type against the asset and
        inserts any returned rows as security exceptions.
      parameters:
      - description: Process type
        in: query
        name: process_type
        required: true
        type: string
      - description: Asset ID
        in: query
        name: asset_id
        required: true
        type: string
      - description: Bloomberg global ID
        in: query
        name: id_bb_global
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rules executed
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: process_type and asset_id are required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to execute rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute rules for an asset
      tags:
      - rules
  /v1/api/getAssets:
    get:
      description: Returns the deduplicated set of assets, optionally filtered by
        exception type CODE and severity (CATEGORY_TYPE.CODE).
      parameters:
      - description: EXCEPTION_TYPE.CODE filter
        in: query
        name: exception_type
        type: string
      - description: CATEGORY_TYPE.CODE filter
        in: query
        name: severity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.Asset'
            type: array
        "500":
          description: failed to query assets
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List assets with exception summary
      tags:
      - assets
  /v1/api/getExceptionTypes:
    get:
      description: Returns EXCEPTION_TYPE.CODE values ordered by EXCEPTIONTYPERANK.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception type codes
      tags:
      - exception-types
  /v1/api/getPriorityType:
    get:
      description: Returns SEVERITY_TYPE.CODE values ordered by SEVERITY_RANK.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query priority types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List priority codes
      tags:
      - priority-types
  /v1/api/getRules:
    get:
      description: Returns rules from LIST_RULES, optionally filtered by process type.
      parameters:
      - description: Process type filter
        in: query
        name: process_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.Rule'
            type: array
        "500":
          description: failed to query rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rules
      tags:
      - rules
  /v1/api/getSecurityExceptions:
    get:
      description: Returns SECURITY_EXCEPTION rows for the given asset ID, optionally
        filtered by exception type, severity (CATEGORY_TYPE.CODE), and priority (SEVERITY_TYPE.CODE).
      parameters:
      - description: Asset ID
        in: query
        name: asset_id
        required: true
        type: string
      - description: EXCEPTION_TYPE.CODE filter
        in: query
        name: exception_type
        type: string
      - description: CATEGORY_TYPE.CODE filter
        in: query
        name: severity
        type: string
      - description: SEVERITY_TYPE.CODE filter
        in: query
        name: priority
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/securityrules_security-rules_internal_app_models.SecurityException'
            type: array
        "400":
          description: asset_id query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to query security exceptions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List security exceptions for an asset
      tags:
      - security-exceptions
  /v1/api/getSeverityType:
    get:
      description: Returns CATEGORY_TYPE.CODE values ordered by CATEGORY_RANK.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query severity types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List severity codes
      tags:
      - severity-types
  /v1/api/info:
    get:
      description: Returns a static welcome string used as a basic liveness check.
      produces:
      - text/plain
      responses:
        "200":
          description: Welcome to Go microservices using Fiber
          schema:
            type: string
      summary: Service welcome message
      tags:
      - info
  /v1/api/insertSecurityExceptions:
    post:
      consumes:
      - application/json
      description: |-
        Inserts one or more SECURITY_EXCEPTION rows. Accepts an array of SecurityException objects.
        Long-lived text/event-stream that pushes events such as security_exception.inserted to subscribed clients.
      parameters:
      - description: Security exceptions to insert
        in: body
        name: exceptions
        required: true
        schema:
          items:
            $ref: '#/definitions/securityrules_security-rules_internal_app_models.SecurityException'
          type: array
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: stream of SSE-formatted events
          schema:
            type: string
        "201":
          description: Created
        "400":
          description: invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to insert security exceptions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Server-Sent Events stream of domain changes
      tags:
      - security-exceptions
      - events
swagger: "2.0"
