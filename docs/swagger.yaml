basePath: /de/securities/rules
definitions:
  handlers.executeSNBody:
    properties:
      sn_sql:
        description: |-
          Raw SQL to run against Snowflake. Anything the driver accepts:
          DDL (CREATE / DROP / ALTER), DML, CALL <procedure>, SELECT.
        example: CALL SP_ARCHIVE_STALE_DATES()
        type: string
    type: object
  handlers.updateBulkAssignBody:
    properties:
      assign_to:
        type: string
      is_permanent:
        type: boolean
      rule_names:
        items:
          type: string
        type: array
    type: object
  handlers.updateBulkStatusBody:
    properties:
      comments:
        type: string
      rule_names:
        items:
          type: string
        type: array
      status:
        type: string
      suppress_date:
        type: string
    type: object
  handlers.updateExceptionAssignToBody:
    properties:
      assign_to:
        type: string
      exception_id:
        type: integer
    type: object
  handlers.updateExceptionCommentsBody:
    properties:
      comments:
        type: string
      exception_id:
        type: integer
    type: object
  handlers.updateExceptionSuppressDateBody:
    properties:
      exception_id:
        type: integer
      suppress_date:
        type: string
    type: object
  models.Asset:
    properties:
      all_complete:
        type: boolean
      asset_id:
        type: string
      assign_to:
        type: string
      bbg_last_refresh:
        type: string
      exception_count:
        type: integer
      exception_date:
        type: string
      figi:
        type: string
      priority:
        type: string
      security_description:
        type: string
      severity:
        type: string
      trader:
        type: string
      trading_team:
        type: string
      type:
        type: string
    type: object
  models.Exception:
    properties:
      asset_id:
        type: string
      assign_to:
        type: string
      assign_to_id:
        type: integer
      comments:
        type: string
      created_by:
        type: string
      created_date:
        type: string
      exception_date:
        type: string
      exception_id:
        type: integer
      exception_state:
        type: string
      exception_status:
        type: string
      exception_time:
        type: string
      exception_type:
        type: string
      id_bb_global:
        type: string
      issue_description:
        type: string
      modified_by:
        type: string
      modified_date:
        type: string
      priority:
        type: string
      result_data:
        type: string
      result_type_id:
        type: integer
      rule_id:
        type: integer
      rule_name:
        type: string
      severity:
        type: string
      state_id:
        type: integer
      status_id:
        type: integer
      suppress_date:
        type: string
    type: object
  models.ExecuteRulesRequest:
    properties:
      is_refresh:
        description: |-
          'Y' or 'N' — substituted into any ${IS_REFRESH} placeholder in
          the RULE_CATALOG_SOURCE. Defaults to 'Y' when empty.
        enum:
        - "Y"
        - "N"
        example: "Y"
        type: string
      params:
        additionalProperties:
          type: string
        description: |-
          Extra ${NAME} placeholder substitutions keyed by placeholder name
          (upper-cased, no ${…}). Optional. Empty values become SQL NULL.
        type: object
      rule_name:
        description: |-
          Filter value. When RuleType is CATALOG or RULE it matches
          RULE_CATALOG.NAME (or RULE.RULE_NAME under RULE); under GROUP it
          matches RULE_GROUP.NAME. Empty or "All" runs every catalog.
        example: Security Master
        type: string
      rule_type:
        description: One of CATALOG | GROUP | RULE. Empty is equivalent to CATALOG.
        enum:
        - CATALOG
        - GROUP
        - RULE
        example: GROUP
        type: string
    type: object
  models.ExecuteRulesResponse:
    properties:
      exception_count:
        description: |-
          Total number of exceptions inserted by this run (i.e. len(produced)
          after every catalog in scope ran and the archive-then-insert
          pipeline finished). Zero when the scope resolves to no catalogs
          or when a catalog failed before insert.
        example: 280
        type: integer
      exception_message:
        description: |-
          Human-readable failure detail. Always present in the JSON — an
          empty string on success, populated with the wrapped error
          message on 404 (bad scope) and 500 (Snowflake / SP failure).
          Kept unconditionally (no omitempty) so callers can rely on
          `exception_message` existing in every response.
        example: ""
        type: string
      exception_status:
        description: |-
          Mirrors the HTTP status the endpoint returned: 200 on success,
          404 when the requested scope resolved to zero catalogs, 500 on
          any downstream failure.
        example: 200
        type: integer
    type: object
  models.Rule:
    properties:
      environment:
        type: string
      rule_catalog_id:
        type: integer
      rule_catalog_name:
        type: string
      rule_command:
        type: string
    type: object
  models.RuleGroup:
    properties:
      flag_assign_to_visible:
        type: boolean
      flag_comments_visible:
        type: boolean
      flag_status_visible:
        type: boolean
      flag_suppress_date:
        type: boolean
      name:
        type: string
    type: object
  models.RuleName:
    properties:
      rule_description:
        type: string
      rule_name:
        type: string
    type: object
info:
  contact: {}
  description: REST API for managing security rules, assets, and SECURITY_EXCEPTION
    rows.
  title: Security Rules API
  version: "1.0"
paths:
  /v1/api/events:
    get:
      description: Long-lived text/event-stream that pushes events such as security_exception.inserted
        to subscribed clients.
      produces:
      - text/event-stream
      responses:
        "200":
          description: stream of SSE-formatted events
          schema:
            type: string
      summary: Server-Sent Events stream of domain changes
      tags:
      - events
  /v1/api/executeRules:
    post:
      consumes:
      - application/json
      description: 'Moves today''s EXCEPTION rows for the catalogs implied by (rule_name,
        rule_type) into EXCEPTION_HIST via SP_ARCHIVE_EXCEPTIONS (each row stamped
        with a per-EXCEPTION_DATE BATCH_ID that starts at 1 for a new day and increments
        for subsequent same-day runs), then runs every matching catalog and inserts
        whatever rows the catalog sources return. Per-asset scoping (asset_id / id_bb_global)
        is intentionally not accepted — use /executeSecurityRules for that. rule_name
        + rule_type semantics match /getRules ("CATALOG" / "RULE" match RULE_CATALOG.NAME,
        "GROUP" matches RULE_GROUP.NAME, omit / empty / "All" runs every catalog).
        is_refresh (default "Y") is substituted into any ${IS_REFRESH} placeholder
        in the RULE_CATALOG_SOURCE as a single-quoted ''Y'' / ''N'' literal, ready
        for a VARCHAR proc param. `params` in the request body is an optional map
        of ${NAME} placeholder substitutions — e.g. {"RATINGS_MISSING":"Aa"} substitutes
        ${RATINGS_MISSING} → ''Aa''; empty values become SQL NULL. Blocks until the
        run completes — a Security Master GROUP run against Snowflake can take several
        minutes; the front-of-service proxy (nginx) must have `proxy_read_timeout`
        set high enough to cover it (300s+ is safe). Response is always an ExecuteRulesResponse:
        exception_count is the number of rows inserted this run, exception_message
        carries the backend error text on non-2xx, and exception_status mirrors the
        HTTP status.'
      parameters:
      - description: rule_name / rule_type / is_refresh scope + optional params bag
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ExecuteRulesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: rules executed; exception_count = rows inserted
          schema:
            $ref: '#/definitions/models.ExecuteRulesResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/models.ExecuteRulesResponse'
        "404":
          description: requested rule / catalog / group not found
          schema:
            $ref: '#/definitions/models.ExecuteRulesResponse'
        "500":
          description: failed to execute rules
          schema:
            $ref: '#/definitions/models.ExecuteRulesResponse'
      summary: Execute rules (archive-then-insert)
      tags:
      - rules
  /v1/api/executeSN:
    post:
      consumes:
      - application/json
      description: QA / debugging helper. Executes the caller-supplied `sn_sql` verbatim
        on the live Snowflake connection and returns any row set produced (as an array
        of column→string maps; nulls come back as JSON null). Postgres is intentionally
        not implemented — returns 500 with "not implemented" so this endpoint can't
        accidentally run SQL against local dev data. Result set is capped at 1000
        rows to keep an unbounded SELECT from streaming the whole warehouse. Will
        be removed once no longer needed.
      parameters:
      - description: SQL to run on Snowflake
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.executeSNBody'
      produces:
      - application/json
      responses:
        "200":
          description: row_count + rows (may be empty for DDL)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request body / empty sql
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: execution failed or not implemented for this database
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'TEMPORARY: run arbitrary SQL on Snowflake'
      tags:
      - maintenance
  /v1/api/executeSecurityRules:
    get:
      description: 'Same orchestration as /executeRules but routed through services.ExecuteSecurityRules
        so the security-rule flow can diverge later. Query params are identical: asset_id
        is optional (required when id_bb_global is supplied); rule_name + rule_type
        scope which catalogs run ("CATALOG" / "RULE" match RULE_CATALOG.NAME, "GROUP"
        matches RULE_GROUP.NAME, omit / empty / "All" runs every catalog).'
      parameters:
      - description: Asset ID (omit to run across all assets; required when id_bb_global
          is supplied)
        in: query
        name: asset_id
        type: string
      - description: Bloomberg global ID
        in: query
        name: id_bb_global
        type: string
      - description: Filter value (catalog name or group name depending on rule_type)
        in: query
        name: rule_name
        type: string
      - description: CATALOG | GROUP | RULE
        in: query
        name: rule_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: security rules executed
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: asset_id is required when id_bb_global is supplied
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to execute security rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute security rules
      tags:
      - rules
  /v1/api/getAssets:
    get:
      description: Returns the deduplicated set of assets, optionally filtered by
        exception type CODE and severity (CATEGORY_TYPE.CODE).
      parameters:
      - description: EXCEPTION_TYPE.CODE filter
        in: query
        name: exception_type
        type: string
      - description: CATEGORY_TYPE.CODE filter
        in: query
        name: severity
        type: string
      - description: SEVERITY_TYPE.CODE filter
        in: query
        name: priority
        type: string
      - description: RULE_CATALOG.NAME filter
        in: query
        name: rule_catalog
        type: string
      - description: RULE.RULE_NAME filter
        in: query
        name: rule_name
        type: string
      - description: EXCEPTION_STATE.CODE filter
        in: query
        name: exception_state
        type: string
      - description: DM_USER.USER filter
        in: query
        name: assign_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Asset'
            type: array
        "500":
          description: failed to query assets
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List assets with exception summary
      tags:
      - assets
  /v1/api/getDMUsers:
    get:
      description: Returns DM_USER.USER values ordered by ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query users
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List DM users
      tags:
      - users
  /v1/api/getExceptionHistDates:
    get:
      description: |-
        Returns ISO date strings for the last 60 days that have any
        EXCEPTION_HIST activity, most recent first. Powers the
        "DQM Date" dropdown options.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception history dates
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Distinct EXCEPTION_DATEs available in EXCEPTION_HIST
      tags:
      - exceptions
  /v1/api/getExceptionState:
    get:
      description: Returns EXCEPTION_STATE.CODE values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception state
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception state codes
      tags:
      - exception-state
  /v1/api/getExceptionStatus:
    get:
      description: Returns EXCEPTION_STATUS.NAME values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception status
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception status names
      tags:
      - exception-status
  /v1/api/getExceptionTypes:
    get:
      description: Returns EXCEPTION_TYPE.NAME values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query exception types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exception type names
      tags:
      - exception-types
  /v1/api/getExceptions:
    get:
      description: Returns rows from GET_EXCEPTIONS, which reads the slim EXCEPTION
        table joined with RULE and the EXCEPTION_*_TYPE lookups.
      parameters:
      - description: Asset ID filter
        in: query
        name: asset_id
        type: string
      - description: EXCEPTION_TYPE.NAME filter
        in: query
        name: exception_type
        type: string
      - description: EXCEPTION_SEVERITY_TYPE.NAME filter
        in: query
        name: severity
        type: string
      - description: EXCEPTION_PRIORITY_TYPE.NAME filter
        in: query
        name: priority
        type: string
      - description: RULE_CATALOG.NAME filter (reserved — RULE does not carry RULE_CATALOG_ID
          for filtering yet)
        in: query
        name: rule_catalog
        type: string
      - description: RULE.RULE_NAME filter
        in: query
        name: rule_name
        type: string
      - description: Reserved (RULE has no rule_group yet)
        in: query
        name: rule_group
        type: string
      - description: EXCEPTION_STATE.NAME filter
        in: query
        name: exception_state
        type: string
      - description: DM_USER.USER filter
        in: query
        name: assign_to
        type: string
      - description: SQL ILIKE pattern against RULE.RULE_NAME
        in: query
        name: rule_name_pattern
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exception'
            type: array
        "500":
          description: failed to query exceptions
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List exceptions
      tags:
      - exceptions
  /v1/api/getExceptionsHist:
    get:
      description: |-
        Same shape as /getExceptions but reads from EXCEPTION_HIST
        and only returns rows belonging to that day's LATEST BATCH_ID
        within the caller's rule/catalog/group scope. Powers the "DQM
        Date" back-in-time selector on the sidebar.
      parameters:
      - description: ISO YYYY-MM-DD
        in: query
        name: exception_date
        required: true
        type: string
      - description: Asset ID filter
        in: query
        name: asset_id
        type: string
      - description: EXCEPTION_TYPE.NAME filter
        in: query
        name: exception_type
        type: string
      - description: EXCEPTION_SEVERITY_TYPE.NAME filter
        in: query
        name: severity
        type: string
      - description: EXCEPTION_PRIORITY_TYPE.NAME filter
        in: query
        name: priority
        type: string
      - description: RULE_CATALOG.NAME filter
        in: query
        name: rule_catalog
        type: string
      - description: RULE.RULE_NAME filter
        in: query
        name: rule_name
        type: string
      - description: RULE_GROUP.NAME filter
        in: query
        name: rule_group
        type: string
      - description: EXCEPTION_STATE.NAME filter
        in: query
        name: exception_state
        type: string
      - description: DM_USER.USER filter
        in: query
        name: assign_to
        type: string
      - description: SQL ILIKE pattern against RULE.RULE_NAME
        in: query
        name: rule_name_pattern
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Exception'
            type: array
        "400":
          description: exception_date is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to query exception history
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List history-table exceptions for a specific EXCEPTION_DATE
      tags:
      - exceptions
  /v1/api/getPriorityTypes:
    get:
      description: Returns EXCEPTION_PRIORITY_TYPE.NAME values ordered by SORT_ORDER.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query priority types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List priority names
      tags:
      - priority-types
  /v1/api/getRuleCatalogs:
    get:
      description: Returns RULE_CATALOG.NAME values joined to RULE_GROUP by RULE_GROUP_ID
        and filtered by rule group name.
      parameters:
      - description: Rule group name
        in: query
        name: rule_group
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "400":
          description: rule_group query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to query rule types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule type names for a rule group
      tags:
      - rule-catalogs
  /v1/api/getRuleGroups:
    get:
      description: Returns RULE_GROUP rows (name + flag_status_visible) ordered by
        RULE_GROUP_ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RuleGroup'
            type: array
        "500":
          description: failed to query rule groups
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule groups
      tags:
      - rule-groups
  /v1/api/getRuleNames:
    get:
      description: Returns one {rule_name, rule_description} per RULE row in the given
        catalog. Used by the rule tree view to render the friendlier description on
        each leaf (falling back to rule_name when null/empty) and to label the Exceptions
        header when a specific rule is selected.
      parameters:
      - description: Rule catalog name
        in: query
        name: rule_catalog
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.RuleName'
            type: array
        "400":
          description: rule_catalog query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to query rule names
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule names + descriptions for a catalog
      tags:
      - rule-names
  /v1/api/getRules:
    get:
      description: 'Returns one row per RULE_CATALOG, optionally filtered. rule_type
        controls how rule_name is interpreted: "CATALOG" or "RULE" -> rule_name matches
        RULE_CATALOG.NAME; "GROUP" -> rule_name matches RULE_GROUP.NAME. Omit / empty
        / "All" means no filter.'
      parameters:
      - description: Filter value (catalog name or group name depending on rule_type)
        in: query
        name: rule_name
        type: string
      - description: CATALOG | GROUP | RULE
        in: query
        name: rule_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Rule'
            type: array
        "500":
          description: failed to query rules
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List rule catalogs
      tags:
      - rules
  /v1/api/getSeverityTypes:
    get:
      description: Returns CATEGORY_TYPE.CODE values ordered by CATEGORY_RANK.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: failed to query severity types
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List severity codes
      tags:
      - severity-types
  /v1/api/info:
    get:
      description: Returns a static welcome string used as a basic liveness check.
      produces:
      - text/plain
      responses:
        "200":
          description: Welcome to Go microservices using Fiber
          schema:
            type: string
      summary: Service welcome message
      tags:
      - info
  /v1/api/junk:
    post:
      description: QA reset helper. Runs TRUNCATE TABLE against EXCEPTION and EXCEPTION_HIST
        on Snowflake so a test run can start from an empty state. Postgres is intentionally
        not implemented — returns 500 with "not implemented" if the deployed database
        is Postgres so this can't accidentally wipe local dev data. Will be removed
        once the QA reset workflow no longer needs it.
      produces:
      - application/json
      responses:
        "200":
          description: tables truncated
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: truncate failed or not implemented for this database
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 'TEMPORARY: truncate EXCEPTION and EXCEPTION_HIST (Snowflake only)'
      tags:
      - maintenance
  /v1/api/updateAssignTo:
    get:
      description: Resolves assign_to against DM_USER and updates every
      parameters:
      - description: Asset ID
        in: query
        name: asset_id
        required: true
        type: string
      - description: DM_USER.USER name (empty to unassign)
        in: query
        name: assign_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: rows updated
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: asset_id query parameter is required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: failed to update assign to
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update EXCEPTION.ASSIGN_TO_ID for an asset
      tags:
      - exceptions
  /v1/api/updateBulkAssign:
    post:
      consumes:
      - application/json
      description: |-
        Updates EXCEPTION.ASSIGN_TO_ID for every existing exception
        whose RULE_NAME matches. When is_permanent is false (default),
        also writes one RULE_ASSIGN_OVERRIDE row per rule so
        subsequent rule runs inherit the assignee via the rao join.
        When is_permanent is true, RULE.ASSIGN_TO_ID itself is
        updated for every matched rule and no override row is
        written. Rule names + assignee name are resolved
        server-side via DM_USER."USER" / RULE."RULE_NAME".
      parameters:
      - description: rule_names + assign_to + is_permanent
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.updateBulkAssignBody'
      produces:
      - application/json
      responses:
